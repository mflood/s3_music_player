name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system libraries for headless Qt
        # QtMultimedia links against PulseAudio and ALSA even when it never
        # opens a device, so these are needed to import it at all.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libdbus-1-3 libfontconfig1 libxrender1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 \
            libpulse0 libasound2t64
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify the Qt layer is importable
        # The GUI tests skip themselves if QtMultimedia is unavailable. That is
        # right for a contributor without the extras, but in CI a skip would
        # quietly hide the very breakage this job exists to catch -- so fail
        # here instead.
        run: python -c "import PyQt6.QtMultimedia, s3music.qt.backend; print('Qt layer OK')"
        env:
          PYTHONPATH: .
      - name: Run tests
        run: PYTHONPATH=.:tests python -m pytest tests -v
